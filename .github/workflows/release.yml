name: Release SDK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI from the matching version tag
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  check-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag and the upstream repository for publishing
        if: inputs.publish
        run: |
          test "$GITHUB_REPOSITORY" = try-pulse/pulse-agent-sdk-python
          test "$GITHUB_REF_TYPE" = tag
  verify:
    needs: check-ref
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          attestations: true
